# House search preferences — LIFULL HOME'S (homes.co.jp)
# One block per property type. Empty / null = no filter.
# Location: ku = 区・市名; stations = 駅名 (exact HOME'S labels).
# price.* unit = 万円 (13000 = 1億3000万円).
#
# Field names align with docs/homes-co-jp-search-filters.md

defaults:
  prefecture: 東京都
  walk_minutes_max: 15 # 駅徒歩15分以内
  include_bus_time: false
  # 土地の権利: true → 所有権 only (exclude 借地権)
  freehold: true
  # true → 再建築可 / buildable (exclude 再建築不可)
  constructible: true
  # true → 駐車場あり
  parking: true
  keyword: null
  published_within: null # 本日 | 3日以内 | 7日以内
  # Max building age (築年数). Exact — script re-filters after scrape;
  # HOME'S query uses next coarser step (22 → 25年以内).
  house_age_years_max: 22

# Shared location for all types (also copied into each block)
# ku: Toshima / Shinjuku / Shibuya / Minato / Meguro
# stations: Mita Line area + Setagaya / Shibuya west (Denentoshi,
#           Setagaya, Toyoko, Keio, Inokashira, Odakyu)

_shared_location: &shared_location
  ku:
    - 豊島区
    - 新宿区
    - 渋谷区
    - 港区
    - 目黒区
  stations:
    - 新板橋
    - 板橋区役所前
    - 西巣鴨
    - 板橋本町
    - 本蓮沼
    - 池尻大橋
    - 三軒茶屋
    - 西太子堂
    - 若林
    - 駒沢大学
    - 祐天寺
    - 学芸大学
    - 代々木上原
    - 下北沢
    - 駒場東大前
    - 幡ヶ谷
    - 笹塚
    - 代田橋
    - 明大前

# 間取り: 3 rooms or more
_madori_3plus: &madori_3plus
  - 3K
  - 3DK
  - 3LDK
  - 4K
  - 4DK
  - 4LDK以上

# ---------------------------------------------------------------------------
# 一戸建て (detached house) — /kodate/{new|used}/
# ---------------------------------------------------------------------------
kodate:
  listing: chuko # shinchiku | chuko
  location: *shared_location

  price:
    min: null
    max: 13000 # 1億3000万円
  building_area_m2:
    min: 60 # 建物面積
    max: null
  land_area_m2:
    min: null
    max: null
  madori: *madori_3plus
  walk_minutes_max: 15
  include_bus_time: false
  freehold: true # 所有権
  constructible: true # 再建築可
  parking: true # 駐車場あり
  renovated: []
  images: []
  keyword: null
  kodawari:
    - 所有権
    - 駐車場あり

# ---------------------------------------------------------------------------
# マンション (apartment) — /mansion/{new|used}/
# ---------------------------------------------------------------------------
mansion:
  listing: chuko # shinchiku | chuko
  location: *shared_location

  price:
    min: null
    max: 13000 # 1億3000万円
  include_management_fee: false
  exclusive_area_m2: # 専有面積
    min: 60
    max: null
  balcony_area_20m2_plus: false
  madori: *madori_3plus
  walk_minutes_max: 15
  include_bus_time: false
  freehold: true # 所有権
  constructible: true # 再建築可
  parking: true # 駐車場あり
  renovated: []
  images: []
  keyword: null
  kodawari:
    - 所有権
    - 駐車場あり

# ---------------------------------------------------------------------------
# 土地 (land) — /tochi/
# ---------------------------------------------------------------------------
tochi:
  location: *shared_location

  price:
    min: null
    max: 6000 # 6000万円
  land_area_m2:
    min: 80
    max: null
  walk_minutes_max: 15
  include_bus_time: false
  freehold: true # 所有権
  constructible: true # 再建築可 (not 建築不可)
  parking: true # 駐車場あり (when tagged on land listings)
  building_condition: null # 建築条件付土地 | 建築条件なし土地 | null = either
  images: []
  keyword: null
  kodawari:
    - 所有権
    - 駐車場あり
