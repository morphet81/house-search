# House search preferences — LIFULL HOME'S (homes.co.jp)
# One block per property type. Empty / null = no filter.
# Location: ku = 区・市名; stations = 駅名 (exact HOME'S labels).
# budget.buy_max unit = 万円 purchase (13000 = 1億3000万円).
# budget.rent_max unit = 万円/月 rent.
# Type price.max overrides budget.buy_max when set.
#
# Field names align with docs/homes-co-jp-search-filters.md

defaults:
  prefecture: 神奈川県
  # Max budgets (buy = purchase price; rent = monthly 賃料)
  budget:
    buy_max: 11500 # 1億3000万円 (¥130M)
    rent_max: 35 # 35万円/月
  walk_minutes_max: 15 # 駅徒歩15分以内
  include_bus_time: false
  # 土地の権利: true → 所有権 only (exclude 借地権) — buy only
  freehold: true
  # true → 再建築可 / buildable (exclude 再建築不可) — buy only
  constructible: true
  # true → 駐車場あり
  parking: true
  keyword: null
  published_within: null # 本日 | 3日以内 | 7日以内
  # Max building age (築年数). Exact — script re-filters after scrape;
  # HOME'S query uses next coarser step (22 → 25年以内).
  house_age_years_max: 20 # ≤20 years (kodate buy; mansion / rent override)

# Shared location for all types (also copied into each block)
# ku: unused — station search only.
# stations: Saint Maur International School (Yamate-cho) ≤20 min transit.
#           Walk hubs: 元町・中華街 / 石川町 / 山手. Prior LFI Tokyo list in git.

_shared_location: &shared_location
  ku: []
  stations:
    # Walk / near-walk to campus
    - 元町・中華街
    - 石川町
    - 山手
    - 日本大通り
    # Minatomirai + JR Negishi belt
    - 馬車道
    - みなとみらい
    - 新高島
    - 関内
    - 桜木町
    - 根岸
    - 磯子
    # Blue Line / Keikyu edge
    - 伊勢佐木長者町
    - 日ノ出町

# 間取り: 3 rooms or more
_madori_3plus: &madori_3plus
  - 3K
  - 3DK
  - 3LDK
  - 4K
  - 4DK
  - 4LDK以上

# ---------------------------------------------------------------------------
# 一戸建て (detached house) — /kodate/{new|used}/
# ---------------------------------------------------------------------------
kodate:
  listing: chuko # shinchiku | chuko
  location: *shared_location

  price:
    min: null
    max: null # inherit defaults.budget.buy_max
  building_area_m2:
    min: 100 # 建物面積
    max: null
  land_area_m2:
    min: null
    max: null
  madori: *madori_3plus
  walk_minutes_max: 15
  include_bus_time: false
  freehold: true # 所有権
  constructible: true # 再建築可
  parking: true # 駐車場あり
  renovated: []
  images: []
  keyword: null
  kodawari:
    - 所有権
    - 駐車場あり

# ---------------------------------------------------------------------------
# マンション (apartment) — /mansion/{new|used}/
# ---------------------------------------------------------------------------
mansion:
  listing: chuko # shinchiku | chuko
  location: *shared_location

  price:
    min: null
    max: null # inherit defaults.budget.buy_max
  include_management_fee: false
  exclusive_area_m2: # 専有面積
    min: 75
    max: null
  balcony_area_20m2_plus: false
  madori: *madori_3plus # 3 rooms+
  walk_minutes_max: 15
  include_bus_time: false
  house_age_years_max: 35
  freehold: true # 所有権
  constructible: true # 再建築可
  parking: true # 駐車場あり
  renovated: []
  images: []
  keyword: null
  kodawari:
    - 所有権
    - 駐車場あり

# ---------------------------------------------------------------------------
# 土地 (land) — /tochi/ (buy only)
# ---------------------------------------------------------------------------
tochi:
  location: *shared_location

  price:
    min: null
    max: 6000 # override budget.buy_max — 6000万円
  land_area_m2:
    min: 80
    max: null
  walk_minutes_max: 15
  include_bus_time: false
  freehold: true # 所有権
  constructible: true # 再建築可 (not 建築不可)
  parking: true # 駐車場あり (when tagged on land listings)
  building_condition: null # 建築条件付土地 | 建築条件なし土地 | null = either
  images: []
  keyword: null
  kodawari:
    - 所有権
    - 駐車場あり

# ---------------------------------------------------------------------------
# Rent (賃貸) — /chintai/{mansion|kodate}/
# Reuses mansion / kodate filters + defaults.budget.rent_max.
# freehold / constructible / tochi do not apply.
# overrides.* merge on top of buy-type prefs for that rent search only.
# ---------------------------------------------------------------------------
rent:
  mansion: true
  kodate: true
  overrides:
    kodate:
      house_age_years_max: 30 # buy kodate keeps defaults (≤20)
