# House search preferences — LIFULL HOME'S (homes.co.jp)
# One block per property type. Empty / null = no filter.
# Location: ku = 区・市名; stations = 駅名 (exact HOME'S labels).
# budget.buy_max unit = 万円 purchase (13000 = 1億3000万円).
# budget.rent_max unit = 万円/月 rent.
# Type price.max overrides budget.buy_max when set.
#
# Field names align with docs/homes-co-jp-search-filters.md

defaults:
  prefecture: 東京都
  # Max budgets (buy = purchase price; rent = monthly 賃料)
  budget:
    buy_max: 11000 # 1億3000万円
    rent_max: 25 # 25万円/月
  walk_minutes_max: 15 # 駅徒歩15分以内
  include_bus_time: false
  # 土地の権利: true → 所有権 only (exclude 借地権) — buy only
  freehold: true
  # true → 再建築可 / buildable (exclude 再建築不可) — buy only
  constructible: true
  # true → 駐車場あり
  parking: true
  keyword: null
  published_within: null # 本日 | 3日以内 | 7日以内
  # Max building age (築年数). Exact — script re-filters after scrape;
  # HOME'S query uses next coarser step (22 → 25年以内).
  house_age_years_max: 30

# Shared location for all types (also copied into each block)
# ku: Toshima / Shinjuku / Shibuya / Minato / Meguro / Nerima / Bunkyo
# stations: Mita Line area + Setagaya / Shibuya west (Denentoshi,
#           Toyoko, Oimachi, Odakyu, Keio, Inokashira) + northwest
#           Tokyo (Seibu Ikebukuro, Fukutoshin, Oedo) + Iidabashi ±2

