    - 板橋区役所前
    - 西巣鴨
    - 板橋本町
    - 本蓮沼
    # LFI Tokyo ±15–20 min (Additional + Borderline)
    - 板橋
    - 滝野川一丁目
    - 新庚申塚
    - 庚申塚
    - 北池袋
    - 池尻大橋
    - 三軒茶屋
    - 西太子堂
    - 若林
    - 駒沢大学
    - 祐天寺
    - 学芸大学
    - 代々木上原
    - 下北沢
    - 駒場東大前
    - 幡ヶ谷
    - 笹塚
    - 代田橋
    - 明大前
    - 自由が丘
    - 田園調布
    - 多摩川
    - 新丸子
    - 豪徳寺
    - 経堂
    - 用賀
    - 二子玉川
    - 二子新地
    - 東長崎
    - 椎名町
    - 要町
    - 千川
    - 新江古田
    # Iidabashi ±2 stops, no transfer (JR / Tozai / Yurakucho / Namboku / Oedo)
    - 飯田橋
    - 市ケ谷
    - 四ツ谷
    - 水道橋
    - 御茶ノ水
    - 早稲田
    - 神楽坂
    - 九段下
    - 竹橋
