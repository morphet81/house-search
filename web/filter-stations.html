<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Filter stations</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body class="map-page">
    <main class="page map-layout">
      <p class="back"><a href="index.html">← All types</a></p>
      <h1 id="heading">Filter stations</h1>
      <p class="deal-tabs" role="tablist" aria-label="Deal type">
        <a id="tab-buy" class="deal-tab" href="filter-stations.html?deal=buy">For sale</a>
        <a id="tab-rent" class="deal-tab" href="filter-stations.html?deal=rent">For rent</a>
      </p>
      <p id="summary" class="lead">Loading…</p>
      <div id="error" class="empty" hidden></div>
      <div id="map" class="map-canvas" role="region" aria-label="Filter stations map"></div>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module">
      import { outputUrl } from "./site.js";

      const params = new URLSearchParams(location.search);
      const deal = params.get("deal") === "rent" ? "rent" : "buy";
      const dealLabel = deal === "rent" ? "For rent" : "For sale";

      document.title = `Filter stations · ${dealLabel}`;
      document.getElementById("heading").textContent = `Filter stations · ${dealLabel}`;
      document.getElementById("tab-buy").classList.toggle("deal-tab-active", deal === "buy");
      document.getElementById("tab-rent").classList.toggle("deal-tab-active", deal === "rent");

      const summary = document.getElementById("summary");
      const error = document.getElementById("error");
      const mapEl = document.getElementById("map");
      const color = deal === "rent" ? "#0a7a4a" : "#0b5fff";

      try {
        const res = await fetch(outputUrl(`filter-stations-${deal}.geojson`));
        if (!res.ok) {
          throw new Error(
            `No filter-stations-${deal}.geojson (HTTP ${res.status}). Run npm run stations:geojson`
          );
        }
        const data = await res.json();
        const features = data.features || [];
        summary.textContent = `${features.length} station(s) in ${dealLabel.toLowerCase()} search preferences`;

        if (!features.length) {
          error.hidden = false;
          error.textContent = "No station coordinates.";
          mapEl.hidden = true;
        } else {
          const map = L.map(mapEl, { scrollWheelZoom: true });
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
          }).addTo(map);

          const bounds = [];
          for (const f of features) {
            const [lon, lat] = f.geometry.coordinates;
            const name = f.properties?.name || "";
            L.circleMarker([lat, lon], {
              radius: 6,
              weight: 1,
              color,
              fillColor: color,
              fillOpacity: 0.75,
            })
              .bindPopup(name)
              .bindTooltip(name, { direction: "top", offset: [0, -6] })
              .addTo(map);
            bounds.push([lat, lon]);
          }
          map.fitBounds(bounds, { padding: [40, 40] });
        }
      } catch (e) {
        error.hidden = false;
        error.textContent = String(e.message || e);
        mapEl.hidden = true;
        summary.textContent = "";
      }
    </script>
  </body>
</html>
