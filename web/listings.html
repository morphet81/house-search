<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Listings</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <p class="back"><a href="/">← All types</a></p>
      <h1 id="heading">Listings</h1>
      <p id="summary" class="lead"></p>
      <div id="sort-bar" class="sort-bar" hidden>
        <label class="sort-label" for="sort">Sort</label>
        <select id="sort" class="sort-select" aria-label="Sort listings">
          <option value="price-asc">Price · low → high</option>
          <option value="price-desc">Price · high → low</option>
          <option value="age-asc">Age · newest first</option>
          <option value="age-desc">Age · oldest first</option>
        </select>
        <label class="filter-new">
          <input type="checkbox" id="new-only" />
          New only
        </label>
        <button type="button" id="export-pdf" class="export-btn">Export PDF</button>
        <a id="map-link" class="export-btn map-link" href="#">Map</a>
      </div>
      <div id="error" class="empty" hidden></div>
      <ol id="listings" class="listing-list"></ol>
    </main>
    <script type="module">
      const LABELS = {
        kodate: "一戸建て",
        mansion: "マンション",
        tochi: "土地",
      };

      const WARD_EN = {
        千代田区: "Chiyoda-ku",
        中央区: "Chuo-ku",
        港区: "Minato-ku",
        新宿区: "Shinjuku-ku",
        文京区: "Bunkyo-ku",
        台東区: "Taito-ku",
        墨田区: "Sumida-ku",
        江東区: "Koto-ku",
        品川区: "Shinagawa-ku",
        目黒区: "Meguro-ku",
        大田区: "Ota-ku",
        世田谷区: "Setagaya-ku",
        渋谷区: "Shibuya-ku",
        中野区: "Nakano-ku",
        杉並区: "Suginami-ku",
        豊島区: "Toshima-ku",
        北区: "Kita-ku",
        荒川区: "Arakawa-ku",
        板橋区: "Itabashi-ku",
        練馬区: "Nerima-ku",
        足立区: "Adachi-ku",
        葛飾区: "Katsushika-ku",
        江戸川区: "Edogawa-ku",
      };

      const params = new URLSearchParams(location.search);
      const type = params.get("type") || "kodate";
      const label = LABELS[type] || type;

      document.title = `${label} listings`;
      document.getElementById("heading").textContent = label;

      const summary = document.getElementById("summary");
      const sortBar = document.getElementById("sort-bar");
      const sortSelect = document.getElementById("sort");
      const newOnlyCheckbox = document.getElementById("new-only");
      const exportBtn = document.getElementById("export-pdf");
      const mapLink = document.getElementById("map-link");
      const list = document.getElementById("listings");
      const error = document.getElementById("error");

      const SORT_VALUES = new Set(["price-asc", "price-desc", "age-asc", "age-desc"]);
      const AGE_SORTS = new Set(["age-asc", "age-desc"]);

      let items = [];
      let delta = null;
      let scrapedLabel = "—";

      mapLink.href = `/map.html?type=${encodeURIComponent(type)}`;

      try {
        const res = await fetch(`/output/${encodeURIComponent(type)}.json`);
        if (!res.ok) throw new Error(`No results file for ${type} (HTTP ${res.status})`);
        const data = await res.json();
        items = data.listings || [];
        delta = data.delta || null;
        scrapedLabel = data.scrapedAt
          ? new Date(data.scrapedAt).toLocaleString()
          : "—";

        if (items.length) {
          sortBar.hidden = false;
          if (type === "tochi") {
            for (const opt of sortSelect.querySelectorAll('option[value^="age-"]')) {
              opt.hidden = true;
              opt.disabled = true;
            }
          }
          const initialSort = readSortFromUrl();
          sortSelect.value = initialSort;
          newOnlyCheckbox.checked = params.get("newOnly") === "1";
          updateSummary();
          sortSelect.addEventListener("change", () => {
            writeSortToUrl(sortSelect.value);
            renderList();
          });
          newOnlyCheckbox.addEventListener("change", () => {
            writeNewOnlyToUrl(newOnlyCheckbox.checked);
            updateSummary();
            renderList();
          });
          exportBtn.addEventListener("click", exportPdf);
          renderList();
        } else {
          updateSummary();
        }
      } catch (e) {
        error.hidden = false;
        error.textContent = String(e.message || e);
      }

      function exportPdf() {
        const sort = sortSelect.value;
        const visible = visibleItems();
        const prevTitle = document.title;
        const prevSummary = summary.textContent;
        document.title = `${label} listings (${visible.length})`;
        summary.textContent = `${visible.length} listing(s) · scraped ${scrapedLabel} · sorted ${sortLabel(sort)}`;
        window.addEventListener(
          "afterprint",
          () => {
            document.title = prevTitle;
            summary.textContent = prevSummary;
          },
          { once: true }
        );
        window.print();
      }

      function sortLabel(sort) {
        return (
          {
            "price-asc": "Price · low → high",
            "price-desc": "Price · high → low",
            "age-asc": "Age · newest first",
            "age-desc": "Age · oldest first",
          }[sort] || sort
        );
      }

      function readSortFromUrl() {
        const sort = params.get("sort");
        if (sort && SORT_VALUES.has(sort)) {
          if (type === "tochi" && AGE_SORTS.has(sort)) return "price-asc";
          return sort;
        }
        return "price-asc";
      }

      function writeSortToUrl(sort) {
        const next = new URLSearchParams(location.search);
        next.set("sort", sort);
        history.replaceState(null, "", `${location.pathname}?${next}`);
      }

      function writeNewOnlyToUrl(checked) {
        const next = new URLSearchParams(location.search);
        if (checked) next.set("newOnly", "1");
        else next.delete("newOnly");
        history.replaceState(null, "", `${location.pathname}?${next}`);
      }

      function newCount() {
        return items.filter((it) => it.isNew).length;
      }

      function updateSummary() {
        const parts = [`${items.length} listing(s)`];
        const fresh = newCount();
        if (fresh) parts.push(`${fresh} new`);
        if (delta && (delta.addedCount || delta.removedCount)) {
          parts.push(`+${delta.addedCount} / -${delta.removedCount} since last run`);
        }
        parts.push(`scraped ${scrapedLabel}`);
        if (newOnlyCheckbox.checked) {
          const shown = items.filter((it) => it.isNew).length;
          parts.unshift(`${shown} new listing(s) shown`);
        }
        summary.textContent = parts.join(" · ");
      }

      function visibleItems() {
        if (newOnlyCheckbox.checked) return items.filter((it) => it.isNew);
        return items;
      }

      function renderList() {
        const sorted = sortItems(visibleItems(), sortSelect.value);
        list.replaceChildren();
        for (const it of sorted) {
          list.appendChild(buildListing(it));
        }
      }

      function sortItems(rows, sort) {
        const copy = [...rows];
        copy.sort((a, b) => {
          if (sort === "price-asc" || sort === "price-desc") {
            const pa = priceValue(a);
            const pb = priceValue(b);
            const dir = sort === "price-asc" ? 1 : -1;
            if (pa == null && pb == null) return 0;
            if (pa == null) return 1;
            if (pb == null) return -1;
            return (pa - pb) * dir;
          }
          const aa = ageValue(a);
          const ba = ageValue(b);
          const dir = sort === "age-asc" ? 1 : -1;
          if (aa == null && ba == null) return 0;
          if (aa == null) return 1;
          if (ba == null) return -1;
          return (aa - ba) * dir;
        });
        return copy;
      }

      function priceValue(it) {
        if (it.priceManYen != null && Number.isFinite(it.priceManYen)) return it.priceManYen;
        const text = it.priceText || "";
        const t = String(text).replace(/,/g, "").replace(/\s/g, "");
        const oku = t.match(/([\d.]+)\s*億/);
        const man = t.match(/([\d.]+)\s*万/);
        if (oku && man) return Math.round(parseFloat(oku[1]) * 10000 + parseFloat(man[1]));
        if (oku) return Math.round(parseFloat(oku[1]) * 10000);
        if (man) return Math.round(parseFloat(man[1]));
        return null;
      }

      function ageValue(it) {
        if (it.buildingAgeYears != null && Number.isFinite(it.buildingAgeYears)) {
          return it.buildingAgeYears;
        }
        const builtText = it.detail?.builtText || it.builtText;
        if (builtText) {
          if (/新築/.test(String(builtText))) return 0;
          const age = String(builtText).match(/築\s*(\d+)\s*年/);
          if (age) return Number(age[1]);
          const ym = String(builtText).match(/(\d{4})\s*年/);
          if (ym) return Math.max(0, new Date().getFullYear() - Number(ym[1]));
        }
        const y = it.yearBuilt ?? it.detail?.yearBuilt;
        if (y != null) return Math.max(0, new Date().getFullYear() - Number(y));
        return null;
      }

      function buildListing(it) {
        const li = document.createElement("li");
        li.className = "listing";

        const title = it.title || it.id || "Untitled";
        const price = it.priceText || (it.priceManYen != null ? `${it.priceManYen}万円` : "—");
        const wardEn = resolveWardEn(it);
        const age = formatAge(it);
        const storeys = formatStoreys(it);

        const bits = [
          wardEn,
          age,
          storeys,
          it.madori,
          it.buildingAreaText || (it.buildingAreaM2 != null ? `${it.buildingAreaM2}m²` : null),
          it.landAreaText,
        ].filter(Boolean);

        const maps = it.googleMapsUrl
          ? `<a href="${escapeAttr(it.googleMapsUrl)}" target="_blank" rel="noopener">Google Maps</a>`
          : "";
        const homes = it.url
          ? `<a href="${escapeAttr(it.url)}" target="_blank" rel="noopener">HOME'S</a>`
          : "";

        const newBadge = it.isNew
          ? `<span class="listing-new-badge">New!</span>`
          : "";

        li.innerHTML = `
          <div class="listing-card${it.isNew ? " listing-card--new" : ""}">
            <div class="listing-photo">
              ${
                it.imageUrl
                  ? `<img src="${escapeAttr(it.imageUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer" />`
                  : `<div class="listing-photo-empty">No photo</div>`
              }
              ${newBadge}
            </div>
            <div class="listing-main">
              <div class="listing-price">${escapeHtml(price)}</div>
              <div class="listing-title">${escapeHtml(title)}</div>
              <div class="listing-bits">${escapeHtml(bits.join(" · "))}</div>
              <div class="listing-links">${[maps, homes].filter(Boolean).join(" · ")}</div>
            </div>
          </div>
        `;
        return li;
      }

      function resolveWardEn(it) {
        const known = new Set(Object.values(WARD_EN));
        if (it.wardEn && known.has(it.wardEn)) return it.wardEn;
        if (it.ward && WARD_EN[it.ward]) return WARD_EN[it.ward];

        const addr = [it.address, it.detail?.address, it.ward, it.wardEn]
          .filter(Boolean)
          .join(" ");
        for (const [jp, en] of Object.entries(WARD_EN)) {
          if (addr.includes(jp)) return en;
        }
        return null;
      }

      function formatAge(it) {
        if (it.buildingAgeYears != null) return `Built ${it.buildingAgeYears}y ago`;
        const builtText = it.detail?.builtText || it.builtText;
        if (builtText) {
          const age = String(builtText).match(/築\s*(\d+)\s*年/);
          if (age) return `Built ${age[1]}y ago`;
        }
        const y = it.yearBuilt ?? it.detail?.yearBuilt;
        if (y != null) {
          const years = Math.max(0, new Date().getFullYear() - Number(y));
          return `Built ${years}y ago`;
        }
        return null;
      }

      function formatStoreys(it) {
        if (it.storeys != null) return `${it.storeys} storeys`;
        const structure = it.structure || it.detail?.structure;
        if (structure) {
          const m = String(structure).match(/(\d+)\s*階/);
          if (m) return `${m[1]} storeys`;
        }
        return null;
      }

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function escapeAttr(s) {
        return escapeHtml(s).replaceAll("'", "&#39;");
      }
    </script>
  </body>
</html>
