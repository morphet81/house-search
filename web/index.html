<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>House search results</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <h1>House search results</h1>
      <p class="lead">
        Property types with scraped results in <code>output/</code>.
        <a href="filter-stations.html">Filter stations map</a>
      </p>

      <section class="deal-section" aria-labelledby="sale-heading">
        <h2 id="sale-heading" class="deal-heading">For sale</h2>
        <ul id="sale-results" class="type-list"></ul>
        <p id="sale-empty" class="empty" hidden>No sale results yet.</p>
      </section>

      <section class="deal-section" aria-labelledby="rent-heading">
        <h2 id="rent-heading" class="deal-heading">For rent</h2>
        <ul id="rent-results" class="type-list"></ul>
        <p id="rent-empty" class="empty" hidden>No rent results yet.</p>
      </section>

      <p id="empty" class="empty" hidden>No result files yet. Run <code>npm run list:all</code> first.</p>
    </main>
    <script type="module">
      import { TYPES, outputUrl, formatCriteria } from "./site.js";

      const TYPE_ORDER = TYPES.map((t) => t.type);

      const saleList = document.getElementById("sale-results");
      const rentList = document.getElementById("rent-results");
      const saleEmpty = document.getElementById("sale-empty");
      const rentEmpty = document.getElementById("rent-empty");
      const empty = document.getElementById("empty");

      const loaded = await Promise.all(
        TYPES.map(async (meta) => {
          try {
            const res = await fetch(outputUrl(meta.type));
            if (!res.ok) return null;
            const data = await res.json();
            const deal = data.deal || meta.deal;
            return {
              type: meta.type,
              label: meta.label,
              labelEn: meta.labelEn,
              deal,
              count: Array.isArray(data.listings)
                ? data.listings.length
                : (data.count ?? null),
              scrapedAt: data.scrapedAt ?? null,
              criteria: formatCriteria(data.filters, { deal }),
              pageUrl: `listings.html?type=${encodeURIComponent(meta.type)}`,
            };
          } catch {
            return null;
          }
        })
      );

      const results = loaded
        .filter(Boolean)
        .sort((a, b) => {
          const ia = TYPE_ORDER.indexOf(a.type);
          const ib = TYPE_ORDER.indexOf(b.type);
          return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
        });

      const sale = results.filter((r) => (r.deal || "buy") === "buy");
      const rent = results.filter((r) => r.deal === "rent");

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function appendItems(listEl, items) {
        for (const r of items) {
          const li = document.createElement("li");
          const scraped = r.scrapedAt
            ? new Date(r.scrapedAt).toLocaleString()
            : "unknown time";
          const criteriaHtml = r.criteria.length
            ? `<ul class="type-criteria">${r.criteria
                .map((c) => `<li>${escapeHtml(c)}</li>`)
                .join("")}</ul>`
            : "";
          li.innerHTML = `
            <a class="type-link" href="${r.pageUrl}">
              <span class="type-label">${escapeHtml(r.labelEn || r.label)}</span>
              <span class="type-meta">${r.count ?? "?"} listings · ${escapeHtml(scraped)}</span>
              ${criteriaHtml}
            </a>
          `;
          listEl.appendChild(li);
        }
      }

      if (!results.length) {
        empty.hidden = false;
        saleEmpty.hidden = true;
        rentEmpty.hidden = true;
      } else {
        if (sale.length) appendItems(saleList, sale);
        else saleEmpty.hidden = false;

        if (rent.length) appendItems(rentList, rent);
        else rentEmpty.hidden = false;
      }
    </script>
  </body>
</html>
